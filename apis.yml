description: 'Belle International Holdings (百丽国际) is one of China''s largest women''s footwear
  and fashion retailers, designing, manufacturing, and distributing shoe brands such as Belle, Teenmix,
  Tata, and Staccato alongside a sportswear-distribution business, across thousands of directly
  operated retail outlets and a growing e-commerce presence. Formerly listed on the Hong Kong Stock
  Exchange, the group was taken private in 2017 by a consortium led by Hillhouse Capital and CDH
  Investments in one of the largest Hong Kong take-private deals. It was surfaced in the API Evangelist
  network as a portfolio company of Hillhouse; enrichment found no public developer portal, API
  program, or machine-readable API surface for this consumer-retail company. This remains an identity
  and domain-security profile rather than an integratable API provider.'
